name: Render Remotion

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder proyek (Remotionfakta / Remotionvox)"
        required: true
        default: "Remotionfakta"
      composition:
        description: "ID composition (bab1, bab2, ... atau vox atau fakta)"
        required: true
        default: "bab1"
      scale:
        description: "Skala resolusi (0.5 = tes cepat, 1 = penuh)"
        required: true
        default: "1"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ inputs.folder }}
    env:
      COMP: ${{ inputs.composition }}
      SCALE: ${{ inputs.scale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install library sistem untuk Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependency
        run: npm install

      - name: Render
        run: |
          npx remotion render src/index.ts "$COMP" "out/$COMP.mp4" \
            --scale="$SCALE" \
            --concurrency=$(nproc) \
            --gl=angle

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.composition }}
          path: ${{ inputs.folder }}/out/${{ inputs.composition }}.mp4
          if-no-files-found: error
          retention-days: 7
          
